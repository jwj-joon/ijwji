# Sveltia CMS 설정
# https://github.com/sveltia/sveltia-cms

backend:
  name: github
  # 이 폴더의 git 원격 저장소(origin)와 같은 값이다.
  # 로컬에서는 크롬/엣지로 /admin/ 을 열고 "로컬 저장소로 작업"을 고르면
  # 이 값과 상관없이 이 폴더에 바로 저장된다.
  repo: jwj-joon/ijwji
  branch: main
  # Cloudflare Pages 에서 "GitHub로 로그인"을 쓰려면 인증 워커가 필요하다.
  # (sveltia-cms-auth) 배포 후 아래 주석을 풀고 워커 주소를 넣는다.
  # base_url: https://sveltia-cms-auth.<계정>.workers.dev

# 업로드한 이미지가 들어갈 곳. AGENTS.md: 폭 1600px 이하로 줄여서 올린다.
media_folder: images
public_folder: /images

collections:
  - name: blog
    label: 블로그
    files:
      - name: posts
        label: 글 목록
        file: content/posts.json
        format: json
        fields:
          - name: posts
            label: 글
            label_singular: 글
            widget: list
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - name: kind
                label: 분류
                widget: select
                options:
                  - { label: 글밭(소설·에세이), value: writing }
                  - { label: 사진, value: photo }
                  - { label: 공부, value: note }
              - name: title
                label: 제목
                widget: string
              - name: id
                label: 주소용 이름
                hint: "글 주소 끝에 붙는다. 예: forest-1. 한 번 정하면 바꾸지 않는다."
                widget: string
                pattern: ["^[a-z0-9-]+$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있습니다."]
              - name: date
                label: 날짜
                widget: datetime
                format: YYYY-MM-DD
                time_format: false
                hint: "모르면 비워 둔다. 날짜 없는 글은 목록 맨 뒤에 놓인다."
                required: false
              - name: featured
                label: 첫 화면에 걸기
                hint: "켜면 첫 화면의 대표작으로 먼저 보인다(글밭·공부 3개, 사진 6장). 모자라면 최신 글로 채운다."
                widget: boolean
                default: false
                required: false
              - name: series
                label: 작품명
                hint: "연재하는 글이면 같은 작품끼리 같은 이름을 쓴다. 아니면 비워 둔다."
                widget: string
                required: false
              - name: place
                label: 장소
                hint: "사진 라벨의 둘째 줄. 예: 파리, 루브르 박물관. 모르면 비워 둔다."
                widget: string
                required: false
              - name: size
                label: 걸 크기
                hint: "사진 벽에 걸 크기. 크게 걸 사진을 사이사이 섞으면 벽에 리듬이 생긴다."
                widget: select
                default: m
                required: false
                options:
                  - { label: 크게, value: l }
                  - { label: 보통, value: m }
                  - { label: 작게, value: s }
              - name: image
                label: 이미지
                widget: image
                required: false
              - name: image_small
                label: 작은 이미지
                hint: "사진 벽에 걸 긴 변 800px 사본. 비워 두면 큰 이미지를 그대로 쓴다(페이지가 무거워진다)."
                widget: image
                required: false
              - name: image_alt
                label: 이미지 설명
                hint: "이미지를 볼 수 없는 사람에게 읽어 줄 문장. 장식용이면 비워 둔다."
                widget: string
                required: false
              - name: image_width
                label: 이미지 폭(px)
                hint: "1600 이하. 화면이 덜컹거리지 않게 미리 자리를 잡는 데 쓴다."
                widget: number
                value_type: int
                required: false
              - name: image_height
                label: 이미지 높이(px)
                widget: number
                value_type: int
                required: false
              - name: body
                label: 본문
                hint: "빈 줄 하나로 문단을 나눈다. 마크다운은 쓰지 않는다."
                widget: text
                required: false
