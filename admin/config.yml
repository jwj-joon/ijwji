# Sveltia CMS 설정
# https://github.com/sveltia/sveltia-cms

backend:
  name: github
  # 배포 전에 실제 GitHub 저장소로 바꾼다. 예: 사용자명/저장소이름
  # 지금은 GitHub 원격 저장소가 없어서 비워 둘 수 없으니 자리만 잡아 둔다.
  # 로컬에서는 크롬/엣지로 /admin/ 을 열고 "로컬 저장소로 작업"을 고르면
  # 이 값과 상관없이 이 폴더에 바로 저장된다.
  repo: OWNER/REPO
  branch: main
  # Cloudflare Pages 에서 "GitHub로 로그인"을 쓰려면 인증 워커가 필요하다.
  # (sveltia-cms-auth) 배포 후 아래 주석을 풀고 워커 주소를 넣는다.
  # base_url: https://sveltia-cms-auth.<계정>.workers.dev

# 업로드한 이미지가 들어갈 곳. AGENTS.md: 폭 1600px 이하로 줄여서 올린다.
media_folder: images
public_folder: /images

collections:
  - name: blog
    label: 블로그
    files:
      - name: posts
        label: 글 목록
        file: content/posts.json
        format: json
        fields:
          - name: posts
            label: 글
            label_singular: 글
            widget: list
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - name: kind
                label: 분류
                widget: select
                options:
                  - { label: 소설, value: novel }
                  - { label: 사진, value: photo }
                  - { label: 공부, value: note }
              - name: title
                label: 제목
                widget: string
              - name: id
                label: 주소용 이름
                hint: "글 주소 끝에 붙는다. 예: forest-1. 한 번 정하면 바꾸지 않는다."
                widget: string
                pattern: ["^[a-z0-9-]+$", "영문 소문자, 숫자, 하이픈(-)만 쓸 수 있습니다."]
              - name: date
                label: 날짜
                widget: datetime
                format: YYYY-MM-DD
                time_format: false
              - name: series
                label: 작품명
                hint: "연재 소설이면 같은 작품끼리 같은 이름을 쓴다. 아니면 비워 둔다."
                widget: string
                required: false
              - name: image
                label: 이미지
                widget: image
                required: false
              - name: image_alt
                label: 이미지 설명
                hint: "이미지를 볼 수 없는 사람에게 읽어 줄 문장. 장식용이면 비워 둔다."
                widget: string
                required: false
              - name: image_width
                label: 이미지 폭(px)
                hint: "1600 이하. 화면이 덜컹거리지 않게 미리 자리를 잡는 데 쓴다."
                widget: number
                value_type: int
                required: false
              - name: image_height
                label: 이미지 높이(px)
                widget: number
                value_type: int
                required: false
              - name: body
                label: 본문
                hint: "빈 줄 하나로 문단을 나눈다. 마크다운은 쓰지 않는다."
                widget: text
                required: false
